spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/db_loginMicroservice
spring.datasource.username=root
spring.datasource.password=jtm22
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 1. Fuerza a Hibernate a verificar que las entidades coincidan EXACTAMENTE con las tablas de la BD
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Muestra en la consola de tu IDE todas las consultas SQL que Spring intenta hacer
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Muestra los valores reales de los parámetros en las consultas (útil para auditoría y fechas)
logging.level.org.hibernate.orm.jdbc.bind=trace


spring.flyway.baseline-on-migrate=true

# Clave secreta para firmar los JWT (mínimo 256 bits / 32 caracteres)
jwt.secret=4a7b9e2c8f1d6a3b0e5c9f8d7a6b2e1f4c3b2a1d0e9f8a7b6c5d4e3f2a1k3l2a
# Tiempo de expiración en milisegundos (ejemplo: 86400000 ms = 24 horas)
jwt.expiration-ms=86400000
